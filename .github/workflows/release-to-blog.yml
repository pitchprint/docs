# Mirror the blog's release notes into the docs site.
#
# The release notes are written in Ghost at blog.pitchprint.com. The year files
# under blog/releases/ mirror them, and that mirroring was done by hand — which
# is why WK40-26 shipped on 1 October 2026 and the docs site still stopped at
# WK26-26 from June. This closes that gap.
#
#   a post already in the year file  ->  skipped, forever, however it was edited
#   a post with no <Update> block    ->  converted, images pulled in, PR opened
#
# It is additive only. An existing release note is never regenerated, reordered
# or reformatted — if someone improved a note after it was imported, that
# improvement stands. The guards live in scripts/release-file.mjs, are shared
# with the frontmatter pipeline, and are exercised by `npm test`, including two
# cases that deliberately break the insert logic and assert nothing is written.
#
# THE LABEL COMES FROM THE DATE, NOT THE TITLE. Every label in the repo is
# week-then-year. The post published 1 October 2026 is titled "Release WK26-40",
# which taken literally is year 2040, so the week and year are derived from the
# post's pubDate and a disagreement is reported in the pull request.
#
# EVERY RUN WRITES A LOG to the `sync-logs` branch, pass or fail:
#   git fetch origin sync-logs && git show origin/sync-logs:logs/blog-latest.md
#
# Setup: none. No secrets — it reads a public RSS feed and this repository. It
# needs Settings -> Actions -> General -> Workflow permissions -> "Allow GitHub
# Actions to create and approve pull requests", which the Help Scout sync also
# needs.

name: Release notes to blog

on:
  schedule:
    # 02:00 UTC = 04:00 SAST, every day — the same cadence as the Help Scout
    # sync, an hour later so the two never queue behind each other.
    - cron: "0 2 * * *"
    # TESTING — CURRENTLY ACTIVE. Fires every 5 minutes and is always a DRY
    # RUN: it matches TEST_CRON below, so it can never write a file or open a
    # pull request, however it is triggered. Comment this line out when you
    # have seen enough — it is noisy, it holds the concurrency group, and
    # GitHub throttles repositories that schedule this aggressively.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — report what would be added, but write nothing and open no PR"
        type: boolean
        # Defaults to true, as the Help Scout sync does: opening a pull request
        # is the thing you opt into, not the thing you forget to opt out of.
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-to-blog
  cancel-in-progress: false

env:
  TEST_CRON: "*/5 * * * *"
  # Auto-merge is attempted ONLY when the quality gate reports every block
  # clean: nothing rejected, fidelity at or above the floor, no image missing
  # alt text, no un-accordioned bug-fix section, and the link check green.
  # Anything else waits for a person. Set this to "false" to always wait.
  AUTO_MERGE: "true"
  FIDELITY_FLOOR: "95"
  SYNC_BRANCH: release-notes-sync
  LOG_BRANCH: sync-logs
  BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to see origin/$SYNC_BRANCH and compare its last author.
          fetch-depth: 0

      - name: Decide run mode
        id: mode
        run: |
          dry=false; why="scheduled daily run"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "$TEST_CRON" ]; then
            dry=true; why="test schedule — always a dry run"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              dry=true; why="requested by hand with dry_run"
            else
              why="run by hand"
            fi
          fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          echo "Mode: $([ "$dry" = true ] && echo 'DRY RUN' || echo 'FULL RUN') ($why)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/step-install.log"

      # The guards that make "additive only" true. If they are broken, nothing
      # else in this job should run.
      - name: Test the guards
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/step-tests.log"

      - name: Fetch the blog's RSS feed
        id: fetch
        run: |
          set -o pipefail
          npm run blog-fetch 2>&1 | tee "$RUNNER_TEMP/step-fetch.log"

      # Informational, never fatal: converts the posts that already have a
      # hand-written block and reports how close the conversion gets. This is
      # the only place that measurement can run — the feed is not reachable
      # from a laptop behind the usual egress rules.
      - name: Benchmark the conversion
        id: benchmark
        continue-on-error: true
        run: |
          set -o pipefail
          npm run blog-benchmark 2>&1 | tee "$RUNNER_TEMP/step-benchmark.log"

      - name: Show what would be added
        id: preview
        run: |
          set -o pipefail
          npm run blog-sync 2>&1 | tee "$RUNNER_TEMP/step-preview.log"

      - name: Stop here on a dry run
        if: steps.mode.outputs.dry == 'true'
        run: |
          echo "DRY RUN — nothing written, no pull request."
          {
            echo "### Dry run"
            echo "Nothing was written. What a full run would add:"
            echo '```'
            cat "$RUNNER_TEMP/step-preview.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The branch is rebuilt and force-pushed each run. On this workflow the
      # commit a reviewer makes to it IS the editing work — the alt text, the
      # accordion — so destroying it would be worse than failing.
      - name: Guard — do not clobber a reviewer's commit
        id: guard_branch
        if: steps.mode.outputs.dry != 'true'
        run: |
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch --quiet origin "$SYNC_BRANCH"
            author=$(git log -1 --format=%ae "origin/$SYNC_BRANCH")
            if [ "$author" != "$BOT_EMAIL" ]; then
              echo "::error::$SYNC_BRANCH was last committed to by $author, not the sync bot."
              echo "This run rebuilds and force-pushes that branch, which would discard that work."
              echo "Merge or close the open pull request, then re-run."
              exit 1
            fi
          fi
          echo "Safe to rebuild $SYNC_BRANCH."

      - name: Import the new release notes
        id: ingest
        if: steps.mode.outputs.dry != 'true'
        env:
          RESULT_PATH: ${{ runner.temp }}/gate.json
        run: |
          set -o pipefail
          # Exit 2 means "wrote changes", which is success here, not failure.
          # Exit 1 means every candidate was rejected by the quality gate.
          npm run blog-sync -- --write 2>&1 | tee "$RUNNER_TEMP/step-ingest.log"
          code=${PIPESTATUS[0]}
          case "$code" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing to add." ;;
            2) echo "changed=true"  >> "$GITHUB_OUTPUT"; echo "Release note(s) imported." ;;
            1) echo "::error::Every candidate was rejected by the quality gate — see the log."; exit 1 ;;
            *) echo "::error::ingest-blog-releases.mjs refused (exit $code)."; exit "$code" ;;
          esac

          clean=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync(process.env.RESULT_PATH,'utf8')).clean)}catch(e){console.log('false')}")
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          echo "Quality gate: $([ "$clean" = "true" ] && echo 'CLEAN' || echo 'NEEDS REVIEW')"

      # Independent of whatever the script claims: only these paths may differ,
      # nothing may be deleted, and no year file may LOSE a line.
      - name: Guard — additions only
        id: guard_paths
        if: steps.mode.outputs.dry != 'true'
        run: |
          set -o pipefail
          {
            offenders=$(git status --porcelain \
              | grep -v '^??' \
              | grep -v ' blog/releases/[0-9]\{4\}\.mdx$' \
              | grep -v ' blog/images/' \
              | grep -v ' docs\.json$' \
              | grep -v ' data/blog-releases\.json$' || true)
            if [ -n "$offenders" ]; then
              echo "::error::This job modified files it must never touch:"
              echo "$offenders"
              exit 1
            fi

            deleted=$(git status --porcelain | grep '^ D\|^D ' || true)
            if [ -n "$deleted" ]; then
              echo "::error::Files were deleted:"; echo "$deleted"; exit 1
            fi

            # A removed line in a year file means a published note was altered.
            removed=$(git diff --numstat -- 'blog/releases/*.mdx' | awk '$2 > 0 {print}')
            if [ -n "$removed" ]; then
              echo "::error::Lines were REMOVED from a year file — an existing release note was altered:"
              echo "$removed"
              git diff -- 'blog/releases/*.mdx' | grep '^-' | grep -v '^---' | head -40
              exit 1
            fi

            echo "Additions only — no published release note was modified or deleted."
            echo "New images:"
            git status --porcelain -- blog/images | sed 's/^/  /' || true
          } 2>&1 | tee "$RUNNER_TEMP/step-guard.log"

      - name: Check for broken links
        id: links
        if: steps.mode.outputs.dry != 'true' && steps.ingest.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run links 2>&1 | tee "$RUNNER_TEMP/step-links.log"

      - name: Open or update the pull request
        id: pr
        if: steps.mode.outputs.dry != 'true' && steps.ingest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            if [ -z "$(git status --porcelain -- blog docs.json)" ]; then
              echo "Nothing changed on disk — no pull request needed."
              exit 0
            fi

            git config user.name "release-notes[bot]"
            git config user.email "$BOT_EMAIL"
            git checkout -b "$SYNC_BRANCH"
            # Deliberately NOT data/ — that is a regenerated cache, not content.
            git add blog/releases blog/images docs.json
            git commit -m "Import release note(s) from the blog

          Converted from the posts at blog.pitchprint.com, with their images
          pulled into blog/images/. Labels derive from each post's publication
          date, not its title.

          No existing release note was touched — verified byte for byte.

          Workflow: ${{ github.workflow }} run ${{ github.run_number }}"

            # Safe to force-push: the branch is rebuilt from main every run, and
            # the guard above already refused if a human had committed to it.
            git push --force origin "$SYNC_BRANCH"

            clean="${{ steps.ingest.outputs.clean }}"
            {
              echo "Release note(s) published on the blog but missing from the docs site."
              echo
              if [ "$clean" = "true" ]; then
                echo "**The quality gate passed clean**, so this will merge itself once the"
                echo "required checks go green. Every block met the ${FIDELITY_FLOOR}% fidelity floor,"
                echo "obeyed the house-style rules, and left nothing for a person to fix."
                echo "If you want to stop it, close the pull request or disable auto-merge on it."
              else
                echo "**Held for review.** Something here needs a person — see the gate verdict"
                echo "below. It will not merge on its own."
              fi
              echo
              echo "## Quality gate"
              echo
              echo '```json'
              cat "${{ runner.temp }}/gate.json" 2>/dev/null || echo "{}"
              echo '```'
              echo
              echo "The prose, headings and images come straight from the post, so this should"
              echo "read close to right already. Two things the conversion deliberately does not"
              echo "attempt, because guessing them wrong is worse than leaving them:"
              echo
              echo "## What still needs doing"
              echo
              echo "- [ ] **Bug fixes** — the post's \"We also fixed the following bugs\" section"
              echo "      arrives as plain bold paragraphs. The published notes wrap it in an"
              echo "      \`<AccordionGroup>\`. Where that section ends is ambiguous, so it is"
              echo "      left alone rather than risk burying the sign-off inside a panel."
              echo "- [ ] **Alt text** — any image the post had none for arrives with \`alt=\"\"\`."
              echo "      The report below says how many."
              echo "- [ ] Check the \`description=\` date and the \`rss={{ title }}\` read well."
              echo "- [ ] Delete the \`{/* Imported from … */}\` comment."
              echo
              echo "## What the job did"
              echo
              echo '```'
              cat "$RUNNER_TEMP/step-ingest.log"
              echo '```'
              echo
              echo "## Conversion measured against the hand-written notes"
              echo
              echo '```'
              cat "$RUNNER_TEMP/step-benchmark.log" 2>/dev/null || echo "(benchmark did not run)"
              echo '```'
              echo
              echo "---"
              echo "Re-running rebuilds this branch from scratch, but refuses once a human has"
              echo "committed to it — so edits you make here are safe, and the next run will"
              echo "tell you to merge or close first."
            } > "$RUNNER_TEMP/pr-body.md"

            existing=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
              number="$existing"
              echo "Updated pull request #$number."
            else
              gh pr create \
                --base "$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)" \
                --head "$SYNC_BRANCH" \
                --title "Import release note(s) from the blog" \
                --body-file "$RUNNER_TEMP/pr-body.md"
              number=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
              echo "Opened pull request #$number."
            fi
            echo "number=$number" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$RUNNER_TEMP/step-pr.log"

      # Auto-merge, but only for an import with genuinely nothing to fix.
      #
      # CLEAN means: no block was rejected, every block met the fidelity floor,
      # no image is missing alt text, no bug-fix section needs an accordion,
      # and the link check passed. Anything else leaves the pull request open,
      # which is the normal case — most weeks have an alt-text gap.
      #
      # --auto is deliberate: it hands the merge to GitHub, so branch
      # protection and required checks still apply. Without protection it
      # merges straight away; with it, it waits for the checks to go green.
      - name: Merge it if there is nothing to fix
        id: automerge
        if: >-
          steps.mode.outputs.dry != 'true' &&
          steps.ingest.outputs.changed == 'true' &&
          steps.ingest.outputs.clean == 'true' &&
          steps.links.outcome == 'success' &&
          steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -o pipefail
          {
            if [ "$AUTO_MERGE" != "true" ]; then
              echo "AUTO_MERGE is off — leaving #$PR for review."
              exit 0
            fi
            echo "Every block passed the gate with nothing left for a person."
            echo "Enabling auto-merge on #$PR."
            if gh pr merge "$PR" --squash --auto --delete-branch; then
              echo "Auto-merge enabled. GitHub will merge once required checks pass."
            else
              echo "::warning::Could not enable auto-merge on #$PR."
              echo "The most likely cause is that 'Allow auto-merge' is off in"
              echo "Settings -> General. The pull request is open and mergeable by hand."
            fi
          } 2>&1 | tee "$RUNNER_TEMP/step-automerge.log"

      - name: Say why it was NOT merged
        if: >-
          steps.mode.outputs.dry != 'true' &&
          steps.ingest.outputs.changed == 'true' &&
          steps.ingest.outputs.clean != 'true'
        run: |
          {
            echo "### Left for review"
            echo
            echo "The import did not qualify for auto-merge. From the gate:"
            echo
            echo '```'
            cat "${{ runner.temp }}/gate.json" 2>/dev/null || echo "(no verdict file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------- the log
      # Runs whatever happened above, including a failure. It must never be the
      # reason a run goes red, so every step here tolerates its own errors.
      - name: Publish the run log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY: ${{ steps.mode.outputs.dry }}
          WHY: ${{ steps.mode.outputs.why }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_TESTS: ${{ steps.tests.outcome }}
          O_FETCH: ${{ steps.fetch.outcome }}
          O_BENCH: ${{ steps.benchmark.outcome }}
          O_PREVIEW: ${{ steps.preview.outcome }}
          O_GUARD_BRANCH: ${{ steps.guard_branch.outcome }}
          O_INGEST: ${{ steps.ingest.outcome }}
          O_GUARD_PATHS: ${{ steps.guard_paths.outcome }}
          O_LINKS: ${{ steps.links.outcome }}
          O_PR: ${{ steps.pr.outcome }}
          O_MERGE: ${{ steps.automerge.outcome }}
          CLEAN: ${{ steps.ingest.outputs.clean }}
        run: |
          set +e
          L="$RUNNER_TEMP/run-log.md"
          stamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          slug=$(date -u +"%Y-%m-%d_%H%M%S")
          mode=$([ "$DRY" = "true" ] && echo "DRY RUN" || echo "FULL RUN")

          {
            echo "# Release notes to blog — run ${{ github.run_number }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| When | \`$stamp\` |"
            echo "| Mode | **$mode** ($WHY) |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Result | **${{ job.status }}** |"
            echo "| Quality gate | $([ "$CLEAN" = "true" ] && echo '**CLEAN** — eligible to merge itself' || echo 'needs review') |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo
            echo "## Steps"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            for pair in "Install:$O_INSTALL" "Tests:$O_TESTS" "Fetch feed:$O_FETCH" \
                        "Benchmark:$O_BENCH" "Preview:$O_PREVIEW" \
                        "Branch guard:$O_GUARD_BRANCH" "Import:$O_INGEST" \
                        "Additions-only guard:$O_GUARD_PATHS" "Broken links:$O_LINKS" \
                        "Pull request:$O_PR" "Auto-merge:$O_MERGE"; do
              name="${pair%%:*}"; out="${pair##*:}"
              [ -z "$out" ] && out="skipped"
              case "$out" in
                success)  icon="ok" ;;
                failure)  icon="**FAILED**" ;;
                skipped)  icon="–" ;;
                *)        icon="$out" ;;
              esac
              echo "| $name | $icon |"
            done
            echo
            echo "## Output"
            for f in install tests fetch benchmark preview ingest guard links pr automerge; do
              p="$RUNNER_TEMP/step-$f.log"
              [ -s "$p" ] || continue
              echo; echo "### $f"; echo; echo '```'
              tail -n 200 "$p"
              echo '```'
            done
          } > "$L"

          # Defensive redaction. GitHub masks secrets in its own logs, but this
          # file is committed to the repository, so never rely on that alone.
          sed -i -E 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1<redacted>/g; s/([A-Za-z0-9_]*(KEY|TOKEN|SECRET)[A-Za-z0-9_]*=)[^ ]+/\1<redacted>/gi' "$L"

          # Shares the orphan log branch with the Help Scout sync, under a
          # blog- prefix so the two never overwrite each other's latest.
          work="$RUNNER_TEMP/logrepo"
          rm -rf "$work"
          remote="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"

          if git clone --quiet --depth 1 --branch "$LOG_BRANCH" "$remote" "$work" 2>/dev/null; then
            echo "Appending to existing $LOG_BRANCH branch."
          else
            echo "Creating $LOG_BRANCH branch."
            mkdir -p "$work" && cd "$work"
            git init --quiet
            git checkout --quiet --orphan "$LOG_BRANCH"
            git remote add origin "$remote"
            mkdir -p logs
            printf '# Sync logs\n\nOne file per run: `logs/latest.md` (Help Scout) and `logs/blog-latest.md` (release notes).\nThis branch holds only logs. It is never merged into main.\n' > README.md
          fi

          cd "$work" || exit 0
          mkdir -p logs
          cp "$L" "logs/blog-${slug}-run${{ github.run_number }}.md"
          cp "$L" "logs/blog-latest.md"

          # Keep the 200 most recent release-note run logs.
          ls -1 logs/blog-*-run*.md 2>/dev/null | sort | head -n -200 | xargs -r rm -f

          git config user.name "release-notes[bot]"
          git config user.email "$BOT_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "Log unchanged; nothing to push."
            exit 0
          fi
          git commit --quiet -m "Blog log: run ${{ github.run_number }} — ${{ job.status }} ($mode)"
          git push --quiet origin "$LOG_BRANCH" 2>&1 | tail -3 || echo "Could not push the log (non-fatal)."
          echo "Log written to $LOG_BRANCH:logs/blog-latest.md"
          exit 0

      - name: Log location
        if: always()
        run: |
          echo "### Run log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'git fetch origin sync-logs && git show origin/sync-logs:logs/blog-latest.md' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
