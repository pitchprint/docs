<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="tl ds">
  <title id="tl">Under the hood: PDF rendering</title>
  <desc id="ds">A saved project fans out to parallel serverless render workers, which return a single print-ready PDF, replacing servers that had to be scaled and maintained by hand.</desc>

  <rect width="1200" height="630" fill="#F7F6FC"/>
  <circle cx="1130" cy="70" r="180" fill="#EEEBFD"/>
  <circle cx="96" cy="580" r="120" fill="#EEEBFD"/>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <rect x="72" y="118" width="150" height="34" rx="17" fill="#14121F"/>
    <text x="147" y="141" text-anchor="middle" font-size="14" font-weight="500" fill="#FFFFFF" letter-spacing="0.4">UNDER THE HOOD</text>

    <text x="72" y="242" font-size="66" font-weight="700" fill="#14121F">PDF rendering</text>
    <text x="72" y="294" font-size="24" fill="#57536E">No servers to scale, no queues to</text>
    <text x="72" y="328" font-size="24" fill="#57536E">babysit. Every project renders in</text>
    <text x="72" y="362" font-size="24" fill="#57536E">parallel, on demand.</text>

    <rect x="72" y="424" width="300" height="2" fill="#E4E1F2"/>
    <text x="72" y="468" font-size="16" fill="#6B6880">Vector text and shapes · CMYK with spot colors</text>

    <g>
      <rect x="666" y="256" width="130" height="118" rx="14" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <rect x="688" y="280" width="86" height="8" rx="4" fill="#D9D3F3"/>
      <rect x="688" y="298" width="64" height="8" rx="4" fill="#EEEBFD"/>
      <rect x="688" y="318" width="86" height="30" rx="6" fill="#EEEBFD"/>
      <circle cx="702" cy="333" r="6" fill="#6022E7"/>
      <text x="731" y="398" text-anchor="middle" font-size="14" fill="#57536E">Project saved</text>
    </g>

    <g stroke="#C9C3EC" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M800 292 q34 0 34 -26 t34 -26"/>
      <path d="M800 315 h68"/>
      <path d="M800 338 q34 0 34 26 t34 26"/>
    </g>

    <g>
      <rect x="874" y="212" width="112" height="56" rx="12" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <rect x="874" y="287" width="112" height="56" rx="12" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <rect x="874" y="362" width="112" height="56" rx="12" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <g fill="#07D4CB">
        <path d="M918 230 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
        <path d="M918 305 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
        <path d="M918 380 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
      </g>
      <g font-size="12" fill="#8B87A3">
        <text x="948" y="245">worker</text>
        <text x="948" y="320">worker</text>
        <text x="948" y="395">worker</text>
      </g>
      <text x="930" y="452" text-anchor="middle" font-size="14" fill="#57536E">Rendered in parallel</text>
    </g>

    <g stroke="#C9C3EC" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M992 240 q30 0 30 26 t30 26"/>
      <path d="M992 315 h60"/>
      <path d="M992 390 q30 0 30 -26 t30 -26"/>
    </g>

    <g>
      <rect x="1058" y="252" width="94" height="126" rx="12" fill="#FFFFFF" stroke="#6022E7" stroke-width="2"/>
      <path d="M1058 264 a12 12 0 0 1 12 -12 h58 l24 24 v90 a12 12 0 0 1 -12 12 h-70 a12 12 0 0 1 -12 -12 z" fill="#FFFFFF"/>
      <path d="M1128 252 v24 h24" fill="none" stroke="#6022E7" stroke-width="2" stroke-linejoin="round"/>
      <rect x="1074" y="292" width="52" height="7" rx="3.5" fill="#D9D3F3"/>
      <rect x="1074" y="308" width="40" height="7" rx="3.5" fill="#EEEBFD"/>
      <rect x="1074" y="330" width="62" height="26" rx="6" fill="#6022E7"/>
      <text x="1105" y="348" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">PDF</text>
      <text x="1105" y="402" text-anchor="middle" font-size="14" fill="#57536E">Print-ready</text>
    </g>
  </g>
</svg>
