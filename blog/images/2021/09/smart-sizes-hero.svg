    <text x="72" y="242" font-size="66" font-weight="700" fill="#14121F">One design,</text>
    <text x="72" y="308" font-size="66" font-weight="700" fill="#14121F">every format</text>
    <text x="72" y="360" font-size="24" fill="#57536E">Resize the canvas and the elements</text>
    <text x="72" y="394" font-size="24" fill="#57536E">move with it.</text>

