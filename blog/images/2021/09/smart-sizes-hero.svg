      <rect x="844" y="182" width="212" height="130" rx="12" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <rect x="864" y="202" width="86" height="90" rx="7" fill="#EEEBFD"/>
      <circle cx="890" cy="234" r="15" fill="#6022E7"/>
      <path d="M910 250 q13 -18 28 -5" fill="none" stroke="#07D4CB" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="966" y="212" width="70" height="9" rx="4.5" fill="#D9D3F3"/>
      <rect x="966" y="230" width="52" height="9" rx="4.5" fill="#EEEBFD"/>
      <rect x="966" y="256" width="46" height="18" rx="6" fill="#6022E7"/>
      <text x="950" y="342" text-anchor="middle" font-size="14" fill="#57536E">Landscape</text>

      <rect x="662" y="424" width="150" height="150" rx="12" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <rect x="682" y="444" width="110" height="62" rx="7" fill="#EEEBFD"/>
      <circle cx="710" cy="472" r="14" fill="#6022E7"/>
      <path d="M730 486 q13 -17 26 -5" fill="none" stroke="#07D4CB" stroke-width="3.5" stroke-linecap="round"/>
