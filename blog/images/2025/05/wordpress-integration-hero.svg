<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="tl ds">
  <title id="tl">PitchPrint WordPress integration</title>
  <desc id="ds">The PitchPrint plugin sitting inside a WooCommerce product page, adding a Customize button that opens the design editor.</desc>

  <rect width="1200" height="630" fill="#F7F6FC"/>
  <circle cx="1130" cy="70" r="180" fill="#EEEBFD"/>
  <circle cx="96" cy="580" r="120" fill="#EEEBFD"/>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="72" y="118" width="148" height="34" rx="17" fill="#21759B"/>
    <text x="146" y="141" text-anchor="middle" font-size="14" font-weight="500" fill="#FFFFFF" letter-spacing="0.4">WORDPRESS</text>

    <text x="72" y="242" font-size="66" font-weight="700" fill="#14121F">New plugin</text>
    <text x="72" y="296" font-size="24" fill="#57536E">A rebuilt WooCommerce integration,</text>
    <text x="72" y="330" font-size="24" fill="#57536E">from install to print-ready file.</text>

    <rect x="72" y="392" width="300" height="2" fill="#E4E1F2"/>
    <text x="72" y="436" font-size="16" fill="#6B6880">Works with any theme</text>

    <g>
      <rect x="660" y="120" width="468" height="390" rx="18" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <path d="M660 138 a18 18 0 0 1 18 -18 h432 a18 18 0 0 1 18 18 v30 h-468 z" fill="#F2F0FB"/>
      <circle cx="686" cy="153" r="5" fill="#D9D3F3"/>
      <circle cx="704" cy="153" r="5" fill="#D9D3F3"/>
      <circle cx="722" cy="153" r="5" fill="#D9D3F3"/>
      <rect x="748" y="146" width="200" height="14" rx="7" fill="#E4E1F2"/>

      <rect x="688" y="196" width="176" height="150" rx="10" fill="#FBF7EF"/>
      <rect x="716" y="228" width="120" height="76" rx="6" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <rect x="732" y="248" width="56" height="7" rx="3.5" fill="#6022E7"/>
      <rect x="732" y="264" width="80" height="6" rx="3" fill="#D9D3F3"/>
      <rect x="732" y="278" width="64" height="6" rx="3" fill="#EEEBFD"/>

      <rect x="892" y="196" width="208" height="14" rx="7" fill="#E4E1F2"/>
      <rect x="892" y="222" width="150" height="12" rx="6" fill="#EEEBFD"/>
      <text x="892" y="272" font-size="26" font-weight="700" fill="#14121F">£24.00</text>
      <rect x="892" y="292" width="208" height="44" rx="10" fill="#6022E7"/>
      <text x="996" y="320" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">Customize</text>
      <rect x="892" y="348" width="208" height="40" rx="10" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
      <text x="996" y="374" text-anchor="middle" font-size="15" fill="#8B87A3">Add to cart</text>

      <rect x="688" y="376" width="176" height="12" rx="6" fill="#EEEBFD"/>
      <rect x="688" y="398" width="140" height="12" rx="6" fill="#F2F0FB"/>

      <rect x="688" y="440" width="412" height="46" rx="10" fill="#F7F6FC"/>
      <circle cx="716" cy="463" r="12" fill="#21759B"/>
      <text x="716" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">W</text>
      <text x="740" y="468" font-size="14" fill="#57536E">PitchPrint plugin active</text>
      <circle cx="1074" cy="463" r="9" fill="#07D4CB"/>
      <path d="M1070 463 l3 3 6 -6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
